<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir Warkop Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      
      body { 
        margin: 0; 
        font-family: system-ui, -apple-system, sans-serif; 
        background: #f5f5f5; 
        color: #333;
      }
      
      button { 
        cursor: pointer; 
        padding: 10px 20px; 
        border: none; 
        border-radius: 8px; 
        background: #2563eb; 
        color: white; 
        font-weight: 600; 
        transition: 0.2s;
      }
      
      button:hover {
        background: #1d4ed8;
      }
      
      button:disabled { 
        opacity: 0.5; 
        cursor: not-allowed; 
      }
      
      input, select { 
        padding: 10px; 
        border-radius: 6px; 
        border: 1px solid #ccc; 
        width: 100%; 
        box-sizing: border-box;
        font-size: 14px;
      }
      
      input:focus, select:focus {
        outline: none;
        border-color: #2563eb;
      }
      
      h1, h2, h3, h4 {
        margin: 0 0 15px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
